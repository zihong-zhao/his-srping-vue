spring:
  application:
    name: his-emr
  datasource:
    url: ${HIS_DB_URL:jdbc:postgresql://localhost:5432/his}
    username: ${HIS_DB_USER:his}
    password: ${HIS_DB_PASSWORD:his}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: ${HIS_SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

his:
  jwt:
    secret: ${HIS_JWT_SECRET:his-dev-jwt-secret-key-please-change-in-production-0123456789}
    ttl-minutes: ${HIS_JWT_TTL_MINUTES:480}
  signature:
    dev-key: ${HIS_SIGN_KEY:his-dev-sign-key-0123456789}
    cert-sn: ${HIS_SIGN_CERT_SN:DEV-CA-0001}

logging:
  level:
    com.his: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
